name: CI

on:
  pull_request:
  workflow_call:        

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash         
jobs:
  verify:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false  
      matrix:
       os: [ubuntu-latest, ubuntu-22.04, windows-latest, windows-2022]
       node: [22, 24]
       
    env:
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries
      MONGOMS_VERSION: 8.2.6
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   

      - uses: pnpm/action-setup@v4   

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Cache MongoDB binary (mongodb-memory-server)
        uses: actions/cache@v4
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-${{ runner.os }}-${{ matrix.os }}-${{ env.MONGOMS_VERSION }}

      - run: pnpm install --frozen-lockfile

      - name: Build, lint, typecheck, test
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            TURBO_SCM_BASE="$BASE_SHA" pnpm turbo run build lint typecheck test --affected
          else
            pnpm turbo run build lint typecheck test
          fi

  package-check:
    name: Package contents (pack dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter="./packages/*"
      - run: pnpm --filter "./packages/*" exec pnpm pack --dry-run

  ci-gate:
    name: CI gate
    if: always()
    needs: [verify, package-check]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac