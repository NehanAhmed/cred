name: Bug report
description: Report a bug in a Cred package.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much of this form as you can.
        Security vulnerabilities must NOT be reported here. See SECURITY.md.
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package is affected? You can select more than one.
      multiple: true
      options:
        - "@cred-kit/core"
        - "@cred-kit/express"
        - "@cred-kit/mongo-storage"
        - "@cred-kit/smtp"
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: Version of the package where you see the problem (for example 0.1.0).
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "22 or 24"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database adapter
      description: How are users, refresh tokens, and audit logs stored?
      options:
        - "@cred-kit/mongo-storage (MongoDB / Mongoose)"
        - Custom database adapter
        - Not applicable
  - type: dropdown
    id: email
    attributes:
      label: Email adapter
      description: Which email transport is configured?
      options:
        - "@cred-kit/smtp with SMTP"
        - "@cred-kit/smtp with Resend"
        - Custom email adapter
        - Not applicable
  - type: dropdown
    id: framework
    attributes:
      label: Framework adapter
      options:
        - "@cred-kit/express"
        - Custom framework integration
        - Core services used directly
        - Not applicable
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Step-by-step instructions that reproduce the problem.
      placeholder: |
        1. Start the host application with ...
        2. Call ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output from the application or test run. Remove secrets, tokens, and passwords.
      render: shell
  - type: checkboxes
    id: security
    attributes:
      label: Security
      description: Reporting policy
      options:
        - label: "I confirm this is not a security vulnerability. Security issues must be reported privately through SECURITY.md."
          required: true
